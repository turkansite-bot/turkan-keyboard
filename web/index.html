  if(s!==e)ta.setRangeText(fn(ta.value.slice(s,e)),s,e,'select');else{ta.value=fn(ta.value);ta.setSelectionRange(ta.value.length,ta.value.length)}
  ta.focus({preventScroll:true});snap();ui()}
function key(label,cls,fn,aria){const b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;if(aria)b.setAttribute('aria-label',aria);
  b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',fn);return b}
function delKey(){const b=key('⌫','sp w2 dl',ev=>{if(ev.detail===0)del()},TX('del'));let t,iv;
  const stop=()=>{clearTimeout(t);clearInterval(iv)};
  b.addEventListener('pointerdown',ev=>{ev.preventDefault();del();stop();t=setTimeout(()=>{iv=setInterval(del,55)},380)});
  ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,stop));
  b.addEventListener('contextmenu',e=>e.preventDefault());return b}
function render(){
  const L=LAY[cur],kb=$('kb');kb.textContent='';
  L.rows.forEach((r,ri)=>{const d=document.createElement('div');d.className='row'+(cur==='lat'&&ri>1?' s'+(ri-1):'')+(cur==='ar'&&ri===3?' s1':'');
    r.forEach(g=>{const t=(cur==='lat'&&sh&&ri>0)?g.toLocaleUpperCase(AZ):g;
      d.append(key(t,L.ork&&ri>0?'ork':'',()=>{put(t);if(sh===1){sh=0;render()}},L.ork&&ri>0?toLat(t):undefined))});kb.append(d)});
  const d=document.createElement('div');d.className='row';
  if(cur==='lat')d.append(key('⇧',sh===2?'on':sh===1?'oo':'sp',()=>{const n=Date.now();sh=(sh===1&&n-lastTap<350)?2:(sh?0:1);lastTap=n;render()},TX('shift')));
  d.append(key(L.comma,'sp',()=>put(L.comma)));
  if(L.zw)d.append(key('ZWNJ','sp',()=>put('\u200C'),TX('zw')));
  d.append(key('TÜRKAN','w4',()=>put(' '),TX('space')));
  d.append(key('.','sp',()=>put('.')));
  d.append(delKey());
  d.append(key('⏎','on w2',()=>put('\n'),TX('enter')));
  kb.append(d);
  $('tabs').querySelectorAll('button').forEach(b=>{const on=b.dataset.k===cur;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))});
}
for(const k of Object.keys(LAY)){const b=key(LAY[k].name,'',()=>{cur=k;sh=0;render()});b.dataset.k=k;$('tabs').append(b)}
$('conv').onclick=()=>apply(smart);
$('ork').onclick=()=>apply(toOrk);
$('back').onclick=()=>apply(toLat);
$('undo').onclick=()=>step(-1);
$('redo').onclick=()=>step(1);
$('copy').onclick=()=>copy(ta.value);
$('clr').onclick=()=>{snap();ta.value='';snap();ui();ta.focus()};
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>copy($(b.dataset.c).textContent));
$('sys').onclick=e=>{const b=e.currentTarget,native=ta.inputMode==='none';ta.inputMode=native?'text':'none';b.setAttribute('aria-pressed',String(native));applyLang();ta.blur();ta.focus()};
ta.addEventListener('input',()=>{ui();clearTimeout(tm);tm=setTimeout(snap,500)});
ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey){const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();step(e.shiftKey?1:-1)}else if(k==='y'){e.preventDefault();step(1)}}});
const dark=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function themeBtn(){const d=dark();$('theme').textContent=TX(d?'light':'dark');$('theme').setAttribute('aria-pressed',String(d))}
try{const th=localStorage.getItem('turkan-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
$('theme').onclick=()=>{const n=dark()?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('turkan-theme',n)}catch(e){}themeBtn()};
try{const v=localStorage.getItem('turkan-draft');if(v){ta.value=v;hist[0]={v,s:v.length,e:v.length}}}catch(e){}
try{if(localStorage.getItem('turkan-fa')==='0'){faDigits=false;$('fa').checked=false}}catch(e){}
$('fa').onchange=e=>{faDigits=e.target.checked;try{localStorage.setItem('turkan-fa',faDigits?'1':'0')}catch(_){}ui()};
const I18N={
tag:['Türkcə klaviatura','تورکجه کیبوردو'],
dark:['Qaranlıq tema','قارانلیق تم'],light:['İşıqlı tema','ایشیقلی تم'],
lang:['Əlifbanı dəyiş','الفبانی دییش'],
editor:['Redaktor','ردکتور'],
undo:['↶ Geri qaytar','↶ گئری قایتار'],redo:['↷ Yenidən','↷ یئنیدن'],
text:['Mətn','متن'],ph:['Buraya yaz…','بورایا یاز…'],
ork:['Orxona çevir','اورخونا چئویر'],back:['Orxondan Türkcəyə','اورخوندان تورکجه‌یه'],
cp:['Kopyala','کوپیا ائت'],cpall:['Hamısını kopyala','هامیسینی کوپیا ائت'],clr:['Təmizlə','تمیزله'],
fa:['Fars rəqəmləri','فارس رقملری'],

kbd:['Klaviatura','کیبورد'],layout:['Düzülüş','دوزولوش'],prev:['Üç yazıda önbaxış','اوچ یازیدا اؤن‌باخیش'],
orx:['Orxon','اورخون'],
note:['Önbaxış eyni mətni üç yazıda göstərir. Orxon müasir və təxmini səsləndirmədir, tarixi transkripsiya deyil. Mətn yalnız bu brauzerdə saxlanır.','اؤن‌باخیش ائیی متنی اوچ یازیدا گؤستریر. اورخون مؤاصیر و تقریبی سسلندیرمه‌دیر، تاریخی ترانسکریپسیا دئییل. متن یالنیز بو براوزرده ساخلانیر.'],

cc:[' işarə · ',' نیشانه · '],ww:[' söz',' سؤز'],
del:['Sil','سیل'],shift:['Şift','شیفت'],zw:['Yarım boşluq','یاریم بوشلوق'],space:['Boşluq','بوشلوق'],enter:['Enter','اینتر']};
let AR=true;try{AR=localStorage.getItem('turkan-ui')!=='lat'}catch(e){}
const TX=k=>I18N[k][AR?1:0];
function applyLang(){const e=document.documentElement;e.dir=AR?'rtl':'ltr';e.lang='az';
 document.querySelectorAll('[data-i]').forEach(x=>x.textContent=TX(x.dataset.i));
 document.querySelectorAll('[data-a]').forEach(x=>x.setAttribute('aria-label',TX(x.dataset.a)));
 document.querySelectorAll('[data-p]').forEach(x=>x.placeholder=TX(x.dataset.p));
 $('sys').textContent=TX(ta.inputMode==='none'?'sys1':'sys2');
 $('langt').textContent=AR?'Türkcə':'تورکجه';$('lang').setAttribute('aria-label',TX('lang'));themeBtn()}
$('lang').onclick=()=>{AR=!AR;try{localStorage.setItem('turkan-ui',AR?'ar':'lat')}catch(e){}applyLang();render();ui()};
applyLang();render();ui();
